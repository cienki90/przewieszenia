name: Buduj program GeneratorNN.exe

on:
  push:
    branches: [program-polaczony]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: python -m pip install --upgrade pip pyinstaller pillow python-docx openpyxl ezdxf

      - name: Test wiersza poleceń (cały łańcuch, bez internetu)
        shell: bash
        run: |
          python generator_cli.py "przewieszenia plan.dxf" -o _test --adresy brak --seed 1
          test -s "_test/przewieszenia plan - przewieszenia.dxf"
          test -s "_test/zestawienie przewieszenia plan.xlsx"
          test -s "_test/Obliczenia - zestawienie przewieszenia plan.xlsx"
          python generator_cli.py "szablon.dxf" -o _test_orient --tylko orientacje --bez-podkladu
          test -s "_test_orient/rysunki stałe/zestawienie_stacji.xlsx"
          python generator_cli.py "pw.dxf" -o _test_num --tylko numeracja
          test -s "_test_num/pw - ponumerowane.dxf"
          python generator_cli.py "przewieszenia plan.dxf" -o _test_ppw --tylko ppw --bez-podkladu --adresy brak --ppw-wt "WT/1"
          test -s "_test_ppw/PPW.docx"
          python generator_cli.py dummy --ppw-renumeruj "pw_final2 - ponumerowane - PZT.dxf"
          test -s "pw_final2 - ponumerowane - PZT - powykonawczy.dxf"
          python generator_cli.py "szablon.dxf" -o _test_zak --tylko zakladki --zakladki-zestawienie "_test_orient/rysunki stałe/zestawienie_stacji.xlsx" --zakladki-format pdf --zakladki-wt "WT/1"
          test -s "_test_zak/zakladki.pdf"

      - name: Budowa exe
        run: >
          pyinstaller --onefile --windowed --name GeneratorNN
          --add-data "przewieszenia baza.dxf;."
          --add-data "arkusze.dxf;."
          --add-data "szablon.dxf;."
          --add-data "orientacja.png;."
          --add-data "szablon_opisu.docx;."
          --add-data "PPW miński szablon.docx;."
          --add-data "wzorce;wzorce"
          --add-data "generator/fonty;fonty"
          --hidden-import PIL._tkinter_finder
          --hidden-import docx
          --hidden-import openpyxl
          --hidden-import ezdxf
          --collect-submodules ezdxf
          generator_gui.py

      - name: Publikacja (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" dist/GeneratorNN.exe \
            --target "${{ github.sha }}" --latest \
            --title "GeneratorNN $TAG" \
            --notes "Program GeneratorNN.exe - uruchom dwuklikiem, wskaż plik planu DXF, zaznacz co wygenerować (przewieszenia / zestawienie / obliczenia / rysunki stałe) i wybierz katalog zapisu. Gałąź: ${{ github.ref_name }}."
