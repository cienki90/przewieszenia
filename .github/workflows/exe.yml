name: Buduj program GeneratorNN.exe

on:
  push:
    branches: [program-polaczony]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Test wiersza poleceń (cały łańcuch, bez internetu)
        shell: bash
        run: |
          python generator_cli.py "przewieszenia plan.dxf" -o _test --adresy brak --seed 1
          test -s "_test/przewieszenia plan - przewieszenia.dxf"
          test -s "_test/zestawienie przewieszenia plan.xlsx"
          test -s "_test/Obliczenia - zestawienie przewieszenia plan.xlsx"

      - name: Budowa exe
        run: >
          pyinstaller --onefile --windowed --name GeneratorNN
          --add-data "przewieszenia baza.dxf;."
          --add-data "arkusze.dxf;."
          generator_gui.py

      - name: Publikacja (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" dist/GeneratorNN.exe \
            --target "${{ github.sha }}" --latest \
            --title "GeneratorNN $TAG" \
            --notes "Program GeneratorNN.exe - uruchom dwuklikiem, wskaż plik planu DXF, zaznacz co wygenerować (przewieszenia / zestawienie / obliczenia) i wybierz katalog zapisu. Gałąź: ${{ github.ref_name }}."
