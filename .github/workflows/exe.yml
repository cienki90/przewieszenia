name: Testy (budowa GeneratorNN.exe tylko na żądanie)

# Każde wypchnięcie gałęzi PGE_MAKER_CLAUDE uruchamia TYLKO testy.
# Budowa .exe jest wyłączona do odwołania (decyzja z 2026-10-30) - zadanie „exe” rusza wyłącznie
# po ręcznym uruchomieniu (Actions -> „Run workflow”) z zaznaczonym „Zbuduj GeneratorNN.exe”.
on:
  push:
    branches: [PGE_MAKER_CLAUDE]
  workflow_dispatch:
    inputs:
      zbuduj_exe:
        description: "Zbuduj GeneratorNN.exe i opublikuj w Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  testy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: python -m pip install --upgrade pip pillow python-docx openpyxl ezdxf sv-ttk pymupdf shapely pyproj numpy requests xlrd xlwt

      - name: Testy jednostkowe (nazwy plików, zakres WT, logika okna)
        run: python -m unittest discover -s testy -v

      - name: Test wiersza poleceń (moduły osobno, bez internetu)
        shell: bash
        run: |
          for m in przewieszenia zestawienie obliczenia; do
            python generator_cli.py --dxf "przyklady/przewieszenia plan.dxf" -o _test --tylko $m --adresy brak --seed 1
          done
          test -s "_test/!Przewieszenia przewieszenia plan.dxf"
          test -s "_test/zestawienie przewieszenia plan.xlsx"
          test -s "_test/Obliczenia - zestawienie przewieszenia plan.xlsx"
          python generator_cli.py --dxf "szablon.dxf" -o _test_orient --tylko orientacje --bez-podkladu
          test -s "_test_orient/rysunki stałe/zestawienie_stacji.xlsx"
          python generator_cli.py --dxf "_test_orient/rysunki stałe" --tylko pdf
          test -s "_test_orient/rysunki stałe/494.pdf"
          python generator_cli.py --dxf "przyklady/pw.dxf" -o _test_num --tylko numeracja
          test -s "_test_num/!ponumerowany pw.dxf"
          python generator_cli.py --dxf "przyklady/przewieszenia plan.dxf" -o _test_ppw --tylko ppw --bez-podkladu --adresy brak --ppw-wt "WT/1"
          test -s "_test_ppw/PPW.docx"
          python generator_cli.py --dxf dummy --ppw-renumeruj "przyklady/pw_final2 - ponumerowane - PZT.dxf"
          test -s "przyklady/!PPW pw_final2.dxf"
          python generator_cli.py --dxf "szablon.dxf" -o _test_zak --tylko zakladki --zakladki-zestawienie "_test_orient/rysunki stałe/zestawienie_stacji.xlsx" --zakladki-format pdf --zakladki-wt "WT/1"
          test -s "_test_zak/zakladki.pdf"

  exe:
    needs: testy
    if: github.event_name == 'workflow_dispatch' && inputs.zbuduj_exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: python -m pip install --upgrade pip pyinstaller pillow python-docx openpyxl ezdxf sv-ttk pymupdf shapely pyproj numpy requests xlrd xlwt

      - name: Numer wersji do programu
        shell: bash
        run: |
          GLOWNA=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)', open('generator/__init__.py',encoding='utf-8').read()).group(1))")
          echo "$GLOWNA.$(git rev-list --count HEAD) ($(git log -1 --format=%cs), $(git rev-parse --short HEAD))" > generator/_wersja.txt
          cat generator/_wersja.txt

      - name: Budowa exe
        run: >
          pyinstaller --onefile --windowed --name GeneratorNN
          --add-data "przewieszenia baza.dxf;."
          --add-data "arkusze.dxf;."
          --add-data "szablon.dxf;."
          --add-data "orientacja.png;."
          --add-data "szablon_opisu.docx;."
          --add-data "PPW miński szablon.docx;."
          --add-data "wzorce;wzorce"
          --add-data "generator/fonty;fonty"
          --add-data "generator/_wersja.txt;generator"
          --add-data "generator/grafika;generator/grafika"
          --add-data "generator/warunki/szablony;generator/warunki/szablony"
          --collect-submodules generator.warunki
          --hidden-import PIL._tkinter_finder
          --hidden-import docx
          --hidden-import openpyxl
          --hidden-import ezdxf
          --collect-submodules ezdxf
          --collect-data sv_ttk
          --hidden-import sv_ttk
          --hidden-import pymupdf
          generator_gui.py

      - name: Publikacja (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" dist/GeneratorNN.exe \
            --target "${{ github.sha }}" --latest \
            --title "GeneratorNN $TAG" \
            --notes "Program GeneratorNN.exe - uruchom dwuklikiem, wskaż plik planu DXF, zaznacz co wygenerować (przewieszenia / zestawienie / obliczenia / rysunki stałe) i wybierz katalog zapisu. Gałąź: ${{ github.ref_name }}."
